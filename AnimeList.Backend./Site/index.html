<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Anico</title>
        <link href='https://fonts.googleapis.com/css?family=Inter' rel='stylesheet'>
        <link rel="stylesheet" href="styles.css">
    </head>
    <body>
        <div class="container">
            <div class="left_column">
                <div class="branding"></div>
                <div class="filters">
                    <div class="format_filters">
                        <div class="filter_toggle"></div>
                        <div class="filter_toggle"></div>
                    </div>
                    <div class="service_filters">
                        <div class="filter_toggle"></div>
                        <div class="filter_toggle"></div>
                        <div class="filter_toggle"></div>
                        <div class="filter_toggle"></div>
                    </div>
                    <div class="status_filters">
                        <div class="filter_toggle"></div>
                        <div class="filter_toggle"></div>
                        <div class="filter_toggle"></div>
                        <div class="filter_toggle"></div>
                        <div class="filter_toggle"></div>
                    </div>
                    <div class="genre_filters">
                        <div class="filter_title">
                            <h5>genres</h5>
                        </div>
                        <div class="library">
                            <div class="genre_tag">
                                <h6>romance</h6>
                            </div>
                            <div class="genre_tag">
                                <h6>drama</h6>
                            </div>
                            <div class="genre_tag">
                                <h6>highschool</h6>
                            </div>
                            <div class="genre_tag">
                                <h6>sci-fi</h6>
                            </div>
                            <div class="genre_tag">
                                <h6>comedey</h6>
                            </div>
                            <div class="genre_tag">
                                <h6>action</h6>
                            </div>
                            <div class="genre_tag">
                                <h6>horror</h6>
                            </div>
                            <div class="genre_tag">
                                <h6>slice of life</h6>
                            </div>
                        </div>
                    </div>
                    <div class="fan_service_filter">
                        <div class="slider"></div>
                    </div>
                    <div class="season_count_filter">
                        <div class="slider"></div>
                    </div>
                    <div class="episode_count_filter">
                        <div class="slider"></div>
                    </div>
                    <div class="avg_episode_length_filter">
                        <div class="slider"></div>
                    </div>
                    <div class="film_length_filter">
                        <div class="slider"></div>
                    </div>
                    <div class="dub_language_filters">
                        <div class="filter_toggle"></div>
                        <div class="filter_toggle"></div>
                        <div class="filter_toggle"></div>
                        <div class="filter_toggle"></div>
                    </div>
                    <div class="sub_language_filters">
                        <div class="filter_toggle"></div>
                        <div class="filter_toggle"></div>
                        <div class="filter_toggle"></div>
                        <div class="filter_toggle"></div>
                    </div>
                    <div class="other_media_filters">
                        <div class="filter_toggle"></div>
                        <div class="filter_toggle"></div>
                        <div class="filter_toggle"></div>
                        <div class="filter_toggle"></div>
                    </div>
                </div>
            </div>
            <div class="main_column">
                <div class="featured">

                </div>
                <div class="list">

                </div>
            </div>
        </div>
    </body>
</html>
